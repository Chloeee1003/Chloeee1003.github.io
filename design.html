<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平面设计 | 林奕辰</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 背景图（不需要就删掉 body 和 body::before） ===== */
    body {
      background-image: url('academic-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    /* ===== 页面标题 ===== */
    .page-title {
      text-align: center;
      font-size: 2rem;
      color: #000;
      margin: 60px 0 10px;
    }
    .page-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 60px;
    }

    /* ===== PDF 预览区 ===== */
    .pdf-section {
      max-width: 900px;
      margin: 0 auto 70px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    .pdf-section h2 {
      font-size: 1.3rem;
      color: #000 !important;
      font-weight: bold !important;
      margin-bottom: 20px;
    }
    .pdf-viewer {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 20px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* ===== 8 张图片网格 ===== */
    .gallery-title {
      text-align: center;
      font-size: 1.3rem;
      color: #000;
      font-weight: bold;
      margin: 0 auto 30px;
      max-width: 1100px;
    }
    .design-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      max-width: 1100px;
      margin: 0 auto 100px;
      padding: 0 25px;
    }
    .design-item {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.3s;
      overflow: hidden;
    }
    .design-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    /* ===== 关键：图片统一尺寸，按比例裁剪，不变形 ===== */
    .design-item img {
      width: 100%;
      height: 260px;              /* 统一高度，可根据需要改数字 */
      object-fit: cover;          /* 按比例裁剪填满，不拉伸变形 */
      object-position: center;    /* 从中间裁剪 */
      border-radius: 10px;
      display: block;
      transition: transform 0.3s;
    }
    .design-item:hover img {
      transform: scale(1.04);     /* 鼠标悬停时轻微放大，效果更好 */
    }

    /* ===== 手机适配 ===== */
    @media (max-width: 768px) {
      .pdf-viewer { height: 420px; }
      .pdf-section { padding: 20px; }
      .design-grid { grid-template-columns: 1fr; padding: 0 20px; gap: 25px; }
      .design-item { padding: 12px; }
      .design-item img { height: 220px; }   /* 手机上高度稍微矮一点 */
    }
  </style>
</head>
<body>

  <div class="page-content">

    <header class="navbar">
      <div class="logo">林奕辰</div>
      <nav>
        <a href="academic.html">← 返回学术作品</a>
        <a href="index.html">返回首页</a>
      </nav>
    </header>

    <h1 class="page-title">平面设计</h1>
    <p class="page-subtitle">我的视觉设计作品集</p>

    <!-- ===== PDF 预览 ===== -->
    <div class="pdf-section">
      <h2>设计作品集（PDF）</h2>
      <iframe class="pdf-viewer" src="design.pdf"></iframe>
      <a href="design.pdf" target="_blank" style="display:inline-block !important; padding:12px 30px !important; background:#333 !important; color:#fff !important; text-decoration:none !important; border-radius:8px !important; font-weight:normal !important; font-size:1rem !important;">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- ===== 8 张图片 ===== -->
    <h2 class="gallery-title">作品展示</h2>
    <div class="design-grid">
      <div class="design-item"><img src="design1.JPG" alt="平面设计作品一"></div>
      <div class="design-item"><img src="design2.JPG" alt="平面设计作品二"></div>
      <div class="design-item"><img src="design3.JPG" alt="平面设计作品三"></div>
      <div class="design-item"><img src="design4.JPG" alt="平面设计作品四"></div>
      <div class="design-item"><img src="design5.JPG" alt="平面设计作品五"></div>
      <div class="design-item"><img src="design6.JPG" alt="平面设计作品六"></div>
      <div class="design-item"><img src="design7.JPG" alt="平面设计作品七"></div>
      <div class="design-item"><img src="design8.JPG" alt="平面设计作品八"></div>
    </div>

  </div>

</body>
</html>
