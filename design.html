<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平面设计 | 林奕辰</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 纯白背景，覆盖全局 ===== */
    html, body {
      background: #ffffff !important;
      background-image: none !important;
      background-color: #ffffff !important;
    }
    .bg-carousel { display: none !important; }

    .page-title {
      text-align: center;
      font-size: 2rem;
      color: #000;
      margin: 60px 0 10px;
    }
    .page-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
    }

    /* ===== PDF 预览区 ===== */
    .pdf-section {
      max-width: 900px;
      margin: 0 auto 70px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .pdf-section h2 {
      font-size: 1.3rem;
      color: #000 !important;
      font-weight: bold !important;
      margin-bottom: 20px;
    }
    .pdf-viewer {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 20px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* ===== 3D 轮播容器 ===== */
    .carousel-wrap {
      position: relative;
      width: 100%;
      height: 520px;
      margin: 0 auto 60px;
      overflow: hidden;
    }
    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .carousel .photo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 420px;
      margin: -210px 0 0 -160px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.8s ease, opacity 0.8s ease;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* ===== 手机适配 ===== */
    @media (max-width: 768px) {
      .pdf-viewer { height: 420px; }
      .pdf-section { padding: 20px; }
      .carousel-wrap { height: 380px; }
      .carousel .photo {
        width: 220px;
        height: 290px;
        margin: -145px 0 0 -110px;
      }
    }
  </style>
</head>
<body>

  <div class="page-content">

    <header class="navbar">
      <div class="logo">林奕辰</div>
      <nav>
        <a href="academic.html">← 返回学术作品</a>
        <a href="index.html">返回首页</a>
      </nav>
    </header>

    <h1 class="page-title">平面设计</h1>
    <p class="page-subtitle">我的视觉设计作品集</p>

    <!-- ===== PDF 预览 ===== -->
    <div class="pdf-section">
      <h2>设计作品集（PDF）</h2>
      <iframe class="pdf-viewer" src="design.pdf"></iframe>
      <a href="design.pdf" target="_blank" style="display:inline-block !important; padding:12px 30px !important; background:#333 !important; color:#fff !important; text-decoration:none !important; border-radius:8px !important; font-weight:normal !important; font-size:1rem !important;">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- ===== 3D 轮播：8 张图 ===== -->
    <div class="carousel-wrap">
      <div class="carousel" id="carousel">
        <img class="photo" src="design1.JPG" alt="作品1">
        <img class="photo" src="design2.JPG" alt="作品2">
        <img class="photo" src="design3.JPG" alt="作品3">
        <img class="photo" src="design4.JPG" alt="作品4">
        <img class="photo" src="design5.JPG" alt="作品5">
        <img class="photo" src="design6.JPG" alt="作品6">
        <img class="photo" src="design7.JPG" alt="作品7">
        <img class="photo" src="design8.JPG" alt="作品8">
      </div>
    </div>

  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const photos = carousel.querySelectorAll('.photo');
    const total = photos.length;
    let currentIndex = 0;

    function update() {
      photos.forEach((photo, i) => {
        let diff = i - currentIndex;
        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;

        const absDiff = Math.abs(diff);
        const scale = Math.max(0.35, 1 - absDiff * 0.15);
        const translateX = diff * 140;
        const zIndex = 100 - absDiff;
        const opacity = absDiff > 3 ? 0 : 1;

        photo.style.transform = `translateX(${translateX}px) scale(${scale})`;
        photo.style.zIndex = zIndex;
        photo.style.opacity = opacity;
      });
    }

    update();

    setInterval(() => {
      currentIndex = (currentIndex + 1) % total;
      update();
    }, 2500);
  </script>

</body>
</html>
