<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的经历 | 林奕辰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-content">

    <!-- 顶部导航 -->
    <header class="navbar">
      <div class="logo">林奕辰</div>
      <nav>
        <a href="index.html">← 返回首页</a>
      </nav>
    </header>

    <!-- 顶部标语 -->
    <div class="exp-header">
      用实践探索世界，用专业解决问题
    </div>

    <!-- 中心辐射布局 -->
    <section class="exp-layout">

      <!-- 左侧卡片 1 -->
      <div class="exp-card">
        <div class="exp-tag">实习经历</div>
        <h3>科大讯飞</h3>
        <p>在这里简单写一句你的实习内容或收获。</p>
      </div>

      <!-- 左侧卡片 2 -->
      <div class="exp-card">
        <div class="exp-tag">媒体实践</div>
        <h3>江苏广电</h3>
        <p>在这里简单写一句你的实践内容或收获。</p>
      </div>

      <!-- 中间 Q版 人物区 -->
      <div class="exp-center">
        <img src="q-version.png" alt="我的Q版造型" class="q-avatar">
        <div class="avatar-label">Hi! 这是我</div>
      </div>

      <!-- 右侧卡片 3 -->
      <div class="exp-card">
        <div class="exp-tag">企业经历</div>
        <h3>昆山仁宝电子公司</h3>
        <p>在这里简单写一句你的工作内容或收获。</p>
      </div>

      <!-- 右侧卡片 4 -->
      <div class="exp-card">
        <div class="exp-tag">校园职务</div>
        <h3>南京大学港澳台台生会副会长</h3>
        <p>在这里简单写一句你的主要职责或成果。</p>
      </div>

    </section>

  </div>

</body>
</html>
