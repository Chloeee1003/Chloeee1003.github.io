<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策划案 | 林奕辰</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 页面背景：如果你要背景图，把 academic-bg.jpg 换成你的图片名；不要背景就删掉 body 这两行 */
    body {
      background-image: url('academic-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.5); /* 白色半透明遮罩，数值0.5可调 */
      z-index: -1;
      pointer-events: none;
    }

    .page-title {
      text-align: center;
      font-size: 2rem;
      color: #000;
      margin: 60px 0 10px;
    }
    .page-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 60px;
    }

    /* 每个策划案的容器 */
    .plan-card {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.9); /* 白色半透明卡片底 */
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .plan-card h2 {
      font-size: 1.3rem;
      color: #000 !important;
      font-weight: bold !important;
      margin-bottom: 20px;
    }

    /* PDF 预览框 */
    .pdf-viewer {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 20px;
    }

    /* 下载按钮 */
    .download-btn {
      display: inline-block;
      padding: 12px 30px;
      background: #333;
      color: #fff !important;
      text-decoration: none !important;
      border-radius: 8px;
      font-weight: normal !important;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #000;
    }

    /* 手机端适配 */
    @media (max-width: 768px) {
      .pdf-viewer {
        height: 400px; /* 手机上方框稍微矮一点 */
      }
    }
  </style>
</head>
<body>

  <div class="page-content">

    <!-- 顶部导航 -->
    <header class="navbar">
      <div class="logo">林奕辰</div>
      <nav>
        <a href="academic.html">← 返回学术作品</a>
        <a href="index.html">返回首页</a>
      </nav>
    </header>

    <h1 class="page-title">策划案</h1>
    <p class="page-subtitle">我的三个策划案作品</p>

    <!-- 策划案一 -->
    <div class="plan-card">
      <h2>策划案一：项目名称</h2>
      <!-- ⚠️ 把 src="plan1.pdf" 换成你实际上传的文件名 -->
      <iframe class="pdf-viewer" src="plan1.pdf"></iframe>
      <a href="plan1.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- 策划案二 -->
    <div class="plan-card">
      <h2>策划案二：项目名称</h2>
      <iframe class="pdf-viewer" src="plan2.pdf"></iframe>
      <a href="plan2.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- 策划案三 -->
    <div class="plan-card">
      <h2>策划案三：项目名称</h2>
      <iframe class="pdf-viewer" src="plan3.pdf"></iframe>
      <a href="plan3.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

  </div>

</body>
</html>
