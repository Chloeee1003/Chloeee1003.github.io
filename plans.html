<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策划案 | 林奕辰</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 背景图（不需要的话，把 body 和 body::before 这两段整段删掉） ===== */
    body {
      background-image: url('academic-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    /* ===== 页面标题 ===== */
    .page-title {
      text-align: center;
      font-size: 2rem;
      color: #000;
      margin: 60px 0 10px;
    }
    .page-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 60px;
    }

    /* ===== 策划案卡片 ===== */
    .plan-card {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .plan-card h2 {
      font-size: 1.3rem;
      color: #000 !important;
      font-weight: bold !important;
      margin-bottom: 20px;
    }

    /* ===== PDF 预览框 ===== */
    .pdf-viewer {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 20px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    /* ===== 下载/查看按钮 ===== */
    .download-btn {
      display: inline-block;
      padding: 12px 30px;
      background: #333;
      color: #fff !important;
      text-decoration: none !important;
      border-radius: 8px;
      font-weight: normal !important;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #000;
      text-decoration: none !important;
    }

    /* ===== 手机适配 ===== */
    @media (max-width: 768px) {
      .pdf-viewer {
        height: 420px;
      }
      .plan-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="page-content">

    <!-- 顶部导航栏 -->
    <header class="navbar">
      <div class="logo">林奕辰</div>
      <nav>
        <a href="academic.html">← 返回学术作品</a>
        <a href="index.html">返回首页</a>
      </nav>
    </header>

    <!-- 标题区 -->
    <h1 class="page-title">策划案</h1>
    <p class="page-subtitle">我的三个策划案作品</p>

    <!-- ===== 策划案一 ===== -->
    <div class="plan-card">
      <h2>策划案一：永不失联的爱</h2>
      <iframe class="pdf-viewer" src="plan1.pdf"></iframe>
      <a href="plan1.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- ===== 策划案二 ===== -->
    <div class="plan-card">
      <h2>策划案二：星星的孩子们</h2>
      <iframe class="pdf-viewer" src="plan2.pdf"></iframe>
      <a href="plan2.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

    <!-- ===== 策划案三 ===== -->
    <div class="plan-card">
      <h2>策划案三：15.8%的轻松，100%的清新</h2>
      <iframe class="pdf-viewer" src="plan3.pdf"></iframe>
      <a href="plan3.pdf" target="_blank" class="download-btn">📄 点击查看 / 下载 PDF</a>
    </div>

  </div>

</body>
</html>
